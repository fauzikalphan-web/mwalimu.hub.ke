services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mwalimu
      POSTGRES_PASSWORD: mwalimu
      POSTGRES_DB: mwalimu_hub_ke
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ['6379:6379']
volumes:
  postgres_data:
