name: Extract Mwalimu Hub project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q mwalimu_hub_ke_v0.5_repo_ready.zip -d extracted
          cp -r extracted/. .
          rm -rf extracted

      - name: Commit extracted project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apps services assets infra docs
          git diff --cached --quiet || git commit -m "Extract Mwalimu Hub KE project"
          git push
